! Configuration file of A-worker 0 of the osmo-bsc A-worker pool (see osmo-bsc_aworker-pool.cfg).
!
! osmo-bsc starts this worker itself, with the osmo-bsc executable and the --aworker-* options; do not
! start it by hand. The worker owns the complete SIGTRAN stack of the cs7 instance(s) configured here:
! reading this file is what creates the ASP and opens its SCTP association. It opens no VTY, no CTRL
! interface, no Abis link and no MGW connection.
!
! This file must contain nothing but cs7 instances and log settings. Every cs7 instance must be
! configured in exactly one worker configuration file, and its 'point-code' must be identical to the
! one in the main configuration file.
!
log stderr
 logging color 1
 logging print category 1
 logging print level 1
 logging level set-all notice
 logging level aworker notice
 ! the SIGTRAN stack this worker owns
 logging level lss7 notice
 logging level lm3ua notice
 logging level lsccp notice

cs7 instance 0
 point-code 0.23.3
 asp asp-bsc-to-stp 2905 0 m3ua
  remote-ip 127.0.0.1
  local-ip 127.0.0.1
  role asp
  transport-role client
  no shutdown
