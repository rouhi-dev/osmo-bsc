! osmo-bsc configuration example for an A-worker pool: the A interface SIGTRAN stack (SCTP, M3UA, SCCP)
! runs in a separate worker process. See the "A-worker pool" chapter of the OsmoBSC user manual.
!
! This is the MAIN configuration file. Its cs7 section holds only the configuration this process needs
! itself: the point code and the SCCP address book. The asp / as nodes live in the worker configuration
! file, osmo-bsc_aworker-pool-worker0.cfg -- osmo-bsc refuses to start if they are in here, because
! reading them would open the SCTP association in this process instead of in the worker.
!
log stderr
 logging color 1
 logging print category 1
 logging print level 1
 logging level set-all notice
 ! the A-worker pool and its IPC
 logging level aworker notice

line vty
 no login
 bind 127.0.0.1

e1_input
 e1_line 0 driver ipa
 ipa bind 127.0.0.1

cs7 instance 0
 ! Must be identical to the 'point-code' of cs7 instance 0 in the worker configuration file.
 point-code 0.23.3
 sccp-address msc
  routing-indicator PC
  point-code 0.23.1

a-worker-pool
 ! One worker owns cs7 instance 0 and with it the A interface of every MSC on that instance.
 workers 1
 worker 0 config-file /etc/osmocom/osmo-bsc_aworker-pool-worker0.cfg
 ! Wait this long for the worker to report its cs7 instances before logging an error.
 startup-timeout 20
 ! If the worker dies: drop its SCCP connections, restart it after 5 s and rebuild the MSC
 ! relationship with a new BSSMAP RESET. 'shutdown' would terminate osmo-bsc instead.
 on-worker-failure restart
 restart-delay 5

network
 network country code 001
 mobile network code 01
 encryption a5 0
 neci 1
 mgw 0
  remote-ip 127.0.0.1
  remote-port 2427
  local-ip 127.0.0.1
  local-port 2727
 bts 0
  type osmo-bts
  band DCS1800
  location_area_code 0x0001
  cell_identity 1
  base_station_id_code 63
  ipa unit-id 1234 0
  oml ipa stream-id 255 line 0
  gprs mode none
  trx 0
   rf_locked 0
   arfcn 871
   nominal power 23
   max_power_red 20
   rsl e1 tei 0
   timeslot 0
    phys_chan_config CCCH+SDCCH4
   timeslot 1
    phys_chan_config SDCCH8
   timeslot 2
    phys_chan_config TCH/F
   timeslot 3
    phys_chan_config TCH/F
   timeslot 4
    phys_chan_config TCH/F
   timeslot 5
    phys_chan_config TCH/F
   timeslot 6
    phys_chan_config TCH/F
   timeslot 7
    phys_chan_config TCH/F

msc 0
 ! Resolved from the 'sccp-address' book of cs7 instance 0 above; the full address is sent to the
 ! worker with every connectionless message, so the worker needs no address book of its own.
 msc-addr msc
 allow-emergency deny
